<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wild West Town - Three.js</title>
    <!-- Google Fonts: Authentic 19th Century Western Woodtype & Engraved Serif -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Playfair+Display:ital,wght@0,600;0,700;0,900;1,600&family=Rye&family=Special+Elite&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/index.css" />
  </head>
  <body class="relative w-full h-full select-none">
    <!-- Western Loading Screen (Synchronized with Settings Menu Theme) -->
    <div
      id="loading"
      class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 text-center pointer-events-none transition-opacity duration-500 z-50 flex flex-col items-center"
    >
      <div class="px-8 py-6 rounded-lg bg-[#141312] border-2 border-[#8e1518] shadow-[0_20px_50px_rgba(0,0,0,0.95),0_0_20px_rgba(142,21,24,0.4),inset_0_0_30px_rgba(0,0,0,0.85)] relative min-w-85 text-center">
        <span class="absolute top-2 left-2 text-[10px] text-brass opacity-80">❖</span>
        <span class="absolute top-2 right-2 text-[10px] text-brass opacity-80">❖</span>
        <span class="absolute bottom-2 left-2 text-[10px] text-brass opacity-80">❖</span>
        <span class="absolute bottom-2 right-2 text-[10px] text-brass opacity-80">❖</span>

        <div class="text-[10px] font-cinzel uppercase tracking-[0.3em] text-brass font-bold mb-1.5 opacity-90">
          ★ Frontier Settlement ★
        </div>
        <div id="status-text" class="text-2xl font-cinzel font-black text-[#ede8df] tracking-[0.12em] drop-shadow-[0_2px_4px_rgba(0,0,0,0.9)]">
          WILD WEST TOWN
        </div>
        <div class="w-full h-3 bg-[#0a0a0c] rounded-full mt-4 p-0.5 border border-white/10 overflow-hidden shadow-inner">
          <div id="progress" class="w-0 h-full bg-linear-to-r from-[#8e1518] via-brass to-brass-light rounded-full transition-all duration-200 shadow-[0_0_10px_rgba(203,160,67,0.7)]"></div>
        </div>
        <div class="text-[12px] font-typewriter text-[#a8a39a] tracking-wider mt-3">
          Saddle Up &amp; Stay Awhile, Partner.
        </div>
      </div>
    </div>

    <!-- WASD Navigation Hint -->
    <div
      id="wasd-indicator"
      class="wasd-indicator absolute bottom-6 left-6 z-40 bg-[#141312]/92 border border-[#8e1518]/80 shadow-[0_4px_16px_rgba(0,0,0,0.8)] px-3.5 py-1.5 rounded-lg text-[11.5px] font-typewriter font-semibold text-[#dedad2] tracking-wider opacity-0 transition-opacity duration-300 pointer-events-none"
    >
      <span class="text-brass font-bold">WASD:</span> Move &bull; <span class="text-brass font-bold">Mouse:</span> Look
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
