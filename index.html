<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wild West Town - Three.js</title>
    <!-- Google Fonts: Authentic 19th Century Western Woodtype & Engraved Serif -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Playfair+Display:ital,wght@0,600;0,700;0,900;1,600&family=Rye&family=Special+Elite&display=swap"
      rel="stylesheet"
    />
    <!-- Tailwind CSS Engine -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              parchment: {
                light: '#fdf8ea',
                DEFAULT: '#f3e3be',
                dark: '#d9be85',
                burnt: '#825626',
              },
              leather: {
                light: '#844d24',
                DEFAULT: '#4e280f',
                dark: '#2a1306',
              },
              brass: {
                light: '#f5d580',
                DEFAULT: '#cba043',
                dark: '#7e5d17',
              },
            },
            fontFamily: {
              western: ['Rye', 'serif'],
              cinzel: ['Cinzel', 'serif'],
              parchment: ['"Playfair Display"', 'Georgia', 'serif'],
              typewriter: ['"Special Elite"', 'monospace'],
            },
            boxShadow: {
              western: '0 4px 16px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.5), inset 0 0 12px rgba(90, 45, 15, 0.25)',
              frame: '0 8px 24px rgba(0, 0, 0, 0.8), 0 2px 4px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.6)',
              bubble: '0 10px 25px -3px rgba(0, 0, 0, 0.6), 0 4px 8px -2px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.8)',
            },
          },
        },
      };
    </script>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #140d07;
        font-family: system-ui, -apple-system, sans-serif;
      }
      canvas {
        display: block;
      }
      /* Vintage Western filigree corner decorations */
      .western-corners::before,
      .western-corners::after {
        content: '❖';
        position: absolute;
        font-size: 9px;
        color: #7d1214;
        opacity: 0.85;
      }
      .western-corners::before {
        top: 2px;
        left: 4px;
      }
      .western-corners::after {
        top: 2px;
        right: 4px;
      }

      /* RDR2 Aged Oil Paper Texture & Authentic Distressed Crimson Border (From Image Assets) */
      .rdr2-panel {
        position: relative;
        background-color: #dfbe84;
        background-image: url('/ui/kertas-minyak.jpg');
        background-size: cover;
        background-position: center;
        border-style: solid;
        border-width: 14px;
        border-image: url('/ui/panel-frame.png') 50 fill / 14px round;
        filter: drop-shadow(0 14px 28px rgba(0, 0, 0, 0.85));
      }

      .rdr2-btn {
        position: relative;
        background-color: #dfbe84;
        background-image: url('/ui/kertas-minyak.jpg');
        background-size: cover;
        background-position: center;
        border-style: solid;
        border-width: 8px;
        border-image: url('/ui/btn-frame.png') 28 fill / 8px round;
        color: #1a110b;
        font-family: 'Special Elite', 'Courier Prime', 'Courier New', monospace;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        text-shadow: 0 1px 0 rgba(255, 245, 225, 0.55);
        transition: all 0.15s ease-out;
        cursor: pointer;
        user-select: none;
        filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.6));
      }

      .rdr2-btn:hover {
        filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.75)) drop-shadow(0 0 10px rgba(132, 24, 26, 0.7));
        transform: translateY(-1px);
      }

      .rdr2-btn:active {
        transform: translateY(1px) scale(0.97);
        filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.7));
      }
    </style>
  </head>
  <body class="relative w-full h-full select-none">
    <!-- Western Loading Screen -->
    <div
      id="loading"
      class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 text-center pointer-events-none transition-opacity duration-500 z-50 flex flex-col items-center"
    >
      <div class="px-7 py-5 rounded-xl rdr2-panel relative western-corners min-w-[300px]">
        <div class="text-[11px] font-cinzel uppercase tracking-[0.25em] text-[#7d1214] font-bold mb-1">
          ★ Frontier Settlement ★
        </div>
        <div id="status-text" class="text-2xl font-cinzel font-black text-[#7d1214] tracking-wider drop-shadow-sm">
          WILD WEST TOWN
        </div>
        <div class="w-full h-3 bg-[#1a0f08]/60 rounded-full mt-3.5 p-0.5 border border-[#7d1214]/60 overflow-hidden shadow-inner">
          <div id="progress" class="h-full bg-gradient-to-r from-[#7d1214] via-[#cba043] to-[#f5d580] rounded-full transition-all duration-200 shadow" style="width: 0%"></div>
        </div>
        <div class="text-[12px] font-typewriter text-[#1a110b] tracking-wider mt-2.5">
          Saddle Up &amp; Stay Awhile, Partner.
        </div>
      </div>
    </div>

    <!-- Western Info Badge (Top-Left) -->
    <div
      id="info"
      class="absolute top-4 left-4 z-40 pointer-events-none flex flex-col gap-1 p-3.5 rounded-xl rdr2-panel text-[#1a110b] max-w-sm western-corners"
    >
      <div class="flex items-center gap-2 border-b border-[#7d1214]/25 pb-1.5">
        <span class="text-xs text-[#7d1214]">★</span>
        <span class="font-cinzel font-black text-sm text-[#7d1214] tracking-wider uppercase">Wild West Town</span>
        <span class="text-xs text-[#7d1214]">★</span>
        <span class="text-[10px] font-cinzel text-[#7d1214]/80 font-bold tracking-widest ml-auto">EST. 1885</span>
      </div>
      <div class="text-[12px] font-typewriter leading-relaxed text-[#23150d] mt-1 flex flex-wrap gap-x-2.5 gap-y-1">
        <span><strong class="font-bold text-[#7d1214]">[N]</strong> Day/Night</span>
        <span>&bull;</span>
        <span><strong class="font-bold text-[#7d1214]">[R]</strong> Rain</span>
        <span>&bull;</span>
        <span><strong class="font-bold text-[#7d1214]">[C]</strong> Cycle</span>
        <span>&bull;</span>
        <span><strong class="font-bold text-[#7d1214]">[M]</strong> Sound</span>
      </div>
    </div>

    <!-- WASD Navigation Hint -->
    <div
      id="wasd-indicator"
      class="wasd-indicator absolute top-28 left-4 z-40 rdr2-panel px-3.5 py-1.5 rounded-lg text-[11.5px] font-typewriter font-semibold text-[#1a110b] tracking-wider opacity-0 transition-opacity duration-300 pointer-events-none"
    >
      <span class="text-[#7d1214] font-bold">WASD:</span> Move &bull; <span class="text-[#7d1214] font-bold">Mouse:</span> Look
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
