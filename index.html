<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wild West Town - Three.js</title>
    <!-- Google Fonts: Authentic 19th Century Western Woodtype & Engraved Serif -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Playfair+Display:ital,wght@0,600;0,700;0,900;1,600&family=Rye&family=Special+Elite&display=swap"
      rel="stylesheet"
    />
    <!-- Tailwind CSS Engine -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              parchment: {
                light: '#fdf8ea',
                DEFAULT: '#f3e3be',
                dark: '#d9be85',
                burnt: '#825626',
              },
              leather: {
                light: '#844d24',
                DEFAULT: '#4e280f',
                dark: '#2a1306',
              },
              brass: {
                light: '#f5d580',
                DEFAULT: '#cba043',
                dark: '#7e5d17',
              },
            },
            fontFamily: {
              western: ['Rye', 'serif'],
              cinzel: ['Cinzel', 'serif'],
              parchment: ['"Playfair Display"', 'Georgia', 'serif'],
              typewriter: ['"Special Elite"', 'monospace'],
            },
            boxShadow: {
              western: '0 4px 16px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.5), inset 0 0 12px rgba(90, 45, 15, 0.25)',
              frame: '0 8px 24px rgba(0, 0, 0, 0.8), 0 2px 4px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.6)',
              bubble: '0 10px 25px -3px rgba(0, 0, 0, 0.6), 0 4px 8px -2px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.8)',
            },
          },
        },
      };
    </script>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #140d07;
        font-family: system-ui, -apple-system, sans-serif;
      }
      canvas {
        display: block;
      }
      /* Vintage Western filigree corner decorations */
      .western-corners::before,
      .western-corners::after {
        content: '❖';
        position: absolute;
        font-size: 9px;
        color: #7d1214;
        opacity: 0.85;
      }
      .western-corners::before {
        top: 2px;
        left: 4px;
      }
      .western-corners::after {
        top: 2px;
        right: 4px;
      }

      .western-panel {
        position: relative;
        background-color: #dfbe84;
        background-image: url('/ui/kertas-minyak.jpg');
        background-size: cover;
        background-position: center;
        border-style: solid;
        border-width: 14px;
        border-image: url('/ui/panel-frame.png') 50 fill / 14px round;
        filter: drop-shadow(0 14px 28px rgba(0, 0, 0, 0.85));
      }

      .western-btn {
        position: relative;
        background-color: #dfbe84;
        background-image: url('/ui/kertas-minyak.jpg');
        background-size: cover;
        background-position: center;
        border-style: solid;
        border-width: 8px;
        border-image: url('/ui/btn-frame.png') 28 fill / 8px round;
        color: #1a110b;
        font-family: 'Special Elite', 'Courier Prime', 'Courier New', monospace;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        text-shadow: 0 1px 0 rgba(255, 245, 225, 0.55);
        transition: all 0.15s ease-out;
        cursor: pointer;
        user-select: none;
        filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.6));
      }

      .western-btn:hover {
        filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.75)) drop-shadow(0 0 10px rgba(132, 24, 26, 0.7));
        transform: translateY(-1px);
      }

      .western-btn:active {
        transform: translateY(1px) scale(0.97);
        filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.7));
      }

      /* Western Settings Side Menu Drawer */
      .western-side-menu {
        position: fixed;
        top: 20px;
        left: 20px;
        width: 330px;
        height: 650px;
        max-height: calc(100vh - 40px);
        background-color: #121214;
        background-image: url('/ui/menu-panel-bg.png');
        background-size: 100% 100%;
        background-repeat: no-repeat;
        background-position: center;
        filter: drop-shadow(0 20px 40px rgba(0, 0, 0, 0.95)) drop-shadow(0 4px 12px rgba(0, 0, 0, 0.85));
        border-radius: 4px;
        z-index: 50;
        display: flex;
        flex-direction: column;
        user-select: none;
        transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.2s ease-out;
      }

      .western-side-menu.collapsed {
        transform: translateX(-370px);
        pointer-events: none;
        opacity: 0;
      }

      .western-menu-toggle {
        position: fixed;
        top: 20px;
        left: 20px;
        z-index: 49;
        background: rgba(18, 17, 16, 0.94);
        border: 1.5px solid #8e1518;
        outline: 1px solid rgba(203, 160, 67, 0.45);
        outline-offset: -3px;
        border-radius: 4px;
        color: #ede8df;
        font-family: 'Cinzel', 'Special Elite', monospace;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.1em;
        padding: 8px 18px;
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.85), inset 0 0 12px rgba(142, 21, 24, 0.35);
        backdrop-filter: blur(8px);
        transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
        user-select: none;
      }

      .western-menu-toggle:hover {
        background: rgba(38, 16, 18, 0.98);
        border-color: #c92429;
        outline-color: rgba(245, 213, 128, 0.7);
        color: #ffffff;
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.92), 0 0 14px rgba(201, 36, 41, 0.55), inset 0 0 14px rgba(142, 21, 24, 0.45);
        transform: translateY(-1px);
      }

      .western-menu-header-spacer {
        height: 104px;
        width: 100%;
        flex-shrink: 0;
        cursor: pointer;
      }

      .western-menu-list {
        display: flex;
        flex-direction: column;
        gap: 5px;
        padding: 0 18px;
        overflow-y: auto;
        flex: 1;
        scrollbar-width: thin;
        scrollbar-color: #8e1518 transparent;
      }

      .western-menu-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 14px;
        background: rgba(30, 31, 35, 0.75);
        border: 1.5px solid rgba(255, 255, 255, 0.04);
        border-radius: 4px;
        color: #bfbfbf;
        font-family: 'Special Elite', monospace;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        cursor: pointer;
        transition: all 0.12s ease-out;
      }

      .western-menu-row:hover,
      .western-menu-row.selected {
        background: rgba(45, 18, 20, 0.78);
        border: 2px solid #8e1518;
        color: #ffffff;
        box-shadow: 0 0 10px rgba(142, 21, 24, 0.6), inset 0 0 6px rgba(142, 21, 24, 0.35);
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
        transform: translateX(1px);
      }

      .western-menu-row .row-badge {
        font-size: 11px;
        padding: 1px 7px;
        border-radius: 3px;
        background: rgba(0, 0, 0, 0.45);
        border: 1px solid rgba(255, 255, 255, 0.12);
        color: #e5e5e5;
        letter-spacing: 0.04em;
      }

      .western-menu-row.selected .row-badge {
        background: rgba(142, 21, 24, 0.55);
        border-color: #c92429;
        color: #ffffff;
      }

      .western-menu-footer {
        margin-top: auto;
        padding: 8px 24px 16px 24px;
        flex-shrink: 0;
      }

      .western-menu-divider {
        height: 1px;
        background: linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, 0.35) 20%, rgba(255, 255, 255, 0.35) 80%, transparent 100%);
        margin-bottom: 8px;
      }

      .western-menu-desc {
        font-family: 'Special Elite', monospace;
        font-size: 11.5px;
        line-height: 1.35;
        color: #cccccc;
        min-height: 36px;
        display: flex;
        align-items: center;
        letter-spacing: 0.03em;
      }
    </style>
  </head>
  <body class="relative w-full h-full select-none">
    <!-- Western Loading Screen (Synchronized with Settings Menu Theme) -->
    <div
      id="loading"
      class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 text-center pointer-events-none transition-opacity duration-500 z-50 flex flex-col items-center"
    >
      <div class="px-8 py-6 rounded-lg bg-[#141312] border-2 border-[#8e1518] shadow-[0_20px_50px_rgba(0,0,0,0.95),0_0_20px_rgba(142,21,24,0.4),inset_0_0_30px_rgba(0,0,0,0.85)] relative min-w-[340px] text-center">
        <span class="absolute top-2 left-2 text-[10px] text-[#cba043] opacity-80">❖</span>
        <span class="absolute top-2 right-2 text-[10px] text-[#cba043] opacity-80">❖</span>
        <span class="absolute bottom-2 left-2 text-[10px] text-[#cba043] opacity-80">❖</span>
        <span class="absolute bottom-2 right-2 text-[10px] text-[#cba043] opacity-80">❖</span>

        <div class="text-[10px] font-cinzel uppercase tracking-[0.3em] text-[#cba043] font-bold mb-1.5 opacity-90">
          ★ Frontier Settlement ★
        </div>
        <div id="status-text" class="text-2xl font-cinzel font-black text-[#ede8df] tracking-[0.12em] drop-shadow-[0_2px_4px_rgba(0,0,0,0.9)]">
          WILD WEST TOWN
        </div>
        <div class="w-full h-3 bg-[#0a0a0c] rounded-full mt-4 p-0.5 border border-white/10 overflow-hidden shadow-inner">
          <div id="progress" class="h-full bg-gradient-to-r from-[#8e1518] via-[#cba043] to-[#f5d580] rounded-full transition-all duration-200 shadow-[0_0_10px_rgba(203,160,67,0.7)]" style="width: 0%"></div>
        </div>
        <div class="text-[12px] font-typewriter text-[#a8a39a] tracking-wider mt-3">
          Saddle Up &amp; Stay Awhile, Partner.
        </div>
      </div>
    </div>

    <!-- WASD Navigation Hint -->
    <div
      id="wasd-indicator"
      class="wasd-indicator absolute bottom-6 left-6 z-40 bg-[#141312]/92 border border-[#8e1518]/80 shadow-[0_4px_16px_rgba(0,0,0,0.8)] px-3.5 py-1.5 rounded-lg text-[11.5px] font-typewriter font-semibold text-[#dedad2] tracking-wider opacity-0 transition-opacity duration-300 pointer-events-none"
    >
      <span class="text-[#cba043] font-bold">WASD:</span> Move &bull; <span class="text-[#cba043] font-bold">Mouse:</span> Look
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
